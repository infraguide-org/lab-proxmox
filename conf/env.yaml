  - hostname:    "cephmon03"
    domain:      "strg.wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          130
    networks:    [management, storage0, services]
    netaddr:     auto
    disks:       [8]
  # id: 135 - > HA
