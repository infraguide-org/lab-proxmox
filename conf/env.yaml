---
# Network Layout

# ID Allacation
#   0  -  15  - network
#  16  -  31  - infra
#  32  - 128  - openstack
# 128  - 160  - ceph


##############################################################################
resolve_conf:
  nameservers:
    - 10.14.0.10
  searchdomains: []
##############################################################################
network_conf:
  ############################################################################
  # Public -> Intranet
  ############################################################################
  public:
    iface:       pblc0
    addr:        10.30.0.0/24
  ############################################################################
  # Infra
  ############################################################################
  management:
    iface:   mgmt0
    addr:    10.14.0.0/24
  services:
    iface:   srvc0
    addr:    10.34.10.0/24
  ############################################################################
  # openstack
  ############################################################################
  controlplane:
    iface:   cpln0
    addr:    10.20.8.0/24
    domain:  os.wrx.sckt.net
  dataplane:
    iface:   dpln0
    addr:    10.20.9.0/24
  external:
    # multiple vlans can be used within this interface (trunk mode)
    iface:   xtrn0
    addr:
  ############################################################################
  # ceph
  ############################################################################
  storage0:
    iface:   strg0
    addr:    10.20.21.0/24
    domain:  strg.wrx.sckt.net
  storage1:
    iface:   strg1
    addr:    10.20.22.0/24

##############################################################################
proxmox__network_conf:
  ############################################################################
  # external(vlan)
  ############################################################################
  # flat network
  public:
    iface:   pblc0
    # consulut your provider for ip range
    # addr:
  # vlan networks
  shared3010:
    addr:    10.30.10.0/24
    vlan:    3010
  shared3011:
    addr:    10.30.11.0/24
    vlan:    3011
  shared3012:
    addr:    10.30.12.0/24
    vlan:    3012
##############################################################################
server_conf:
  - hostname:    "dns"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          10
    networks:    [management, services]
    netaddr:     auto
    disks:       [4]
    proxy:       yes
    command:     "curl -sSL https://raw.githack.com/codecap/openstack-workshop/refs/heads/main/scripts/infra/dns.sh | bash"
  - hostname:    "registry"
    domain:      "wrx.sckt.net"
    ram:         8192
    cpu:         2
    id:          17
    networks:    [management, services]
    netaddr:     auto
    disks:       [32]
    command:     "curl -sSL https://raw.githack.com/codecap/openstack-workshop/refs/heads/main/scripts/infra/registry.sh | bash"
  - hostname:    "proxy"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          19
    networks:    [management, services]
    netaddr:     auto
    disks:       [4]
    command:     "curl -sSL https://raw.githack.com/codecap/openstack-workshop/refs/heads/main/scripts/infra/proxy.sh | bash"
  - hostname:    "deployment"
    domain:      "wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          24
    networks:    [management, controlplane, storage0]
    netaddr:     auto
    disks:       [4]
    command:     "curl -sSL --proxy http://proxy.wrx.sckt.net:3128 https://raw.githack.com/codecap/openstack-workshop/refs/heads/main/scripts/infra/deployment.sh | bash"
    airgapped:   soft
  ############################################################################
  #  compute nodes
  ############################################################################
  - hostname:    "compute01"
    domain:      "os.wrx.sckt.net"
    ram:         4096
    cpu:         2
    id:          64
    networks:    [management, controlplane, dataplane, external, public, storage0]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  - hostname:    "compute02"
    domain:      "os.wrx.sckt.net"
    ram:         4096
    cpu:         2
    id:          65
    networks:    [management, controlplane, dataplane, external, public, storage0]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  - hostname:    "compute03"
    domain:      "os.wrx.sckt.net"
    ram:         4096
    cpu:         2
    id:          65
    networks:    [management, controlplane, dataplane, external, public, storage0]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  - hostname:    "compute11"
    domain:      "os.wrx.sckt.net"
    ram:         4096
    cpu:         2
    id:          72
    networks:    [management, controlplane, dataplane, external, public, storage0]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  - hostname:    "compute12"
    domain:      "os.wrx.sckt.net"
