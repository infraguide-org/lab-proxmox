  - hostname:    "compute13"
    domain:      "os.wrx.sckt.net"
    ram:         4096
    cpu:         2
    id:          65
    networks:    [management, controlplane, dataplane, external, public, storage0]
    netaddr:
      external:
      public:
    disks:       [16]
    airgapped:   true
  ############################################################################
  #  ceph
  ############################################################################
  - hostname:    "cephmon01"
    domain:      "strg.wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          128
    networks:    [management, storage0, services]
    netaddr:     auto
    disks:       [8]
    airgapped:   true
  - hostname:    "cephmon02"
    domain:      "strg.wrx.sckt.net"
    ram:         4096
    cpu:         1
    id:          129
    networks:    [management, storage0, services]
    netaddr:     auto
    disks:       [8]
